<style>
body{margin:0;background:#3A1470}
html{scroll-behavior:smooth}
a{color:#FFC857}a:hover{color:#FFE2A3}
.barcode{height:72px;background:repeating-linear-gradient(90deg,#14213D 0 2px,transparent 2px 4px,#14213D 4px 7px,transparent 7px 9px,#14213D 9px 10px,transparent 10px 13px,#14213D 13px 16px,transparent 16px 17px)}

.dash-arc-ink{background:repeating-linear-gradient(90deg,#14213D 0 8px,transparent 8px 16px)}
.cloud{position:absolute;width:260px;height:84px;border-radius:84px;background:#FFFFFF}
.cloud::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:inherit;left:36px;top:-58px}
.cloud::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:inherit;left:96px;top:-86px}
.drift{animation:drift 38s ease-in-out infinite alternate}
.drift-slow{animation:drift 60s ease-in-out infinite alternate-reverse}
@keyframes drift{from{translate:-40px 0}to{translate:60px 0}}
.confetti{position:absolute;width:10px;height:22px;border-radius:3px;animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{translate:0 -10px}to{translate:0 14px}}
.spark{position:absolute;animation:twinkle 2.8s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25;scale:.7}to{opacity:1;scale:1.1}}
.glow{position:absolute;border-radius:50%;filter:blur(70px)}
.disco{border-radius:50%;background-color:#C9C3D9;background-image:repeating-linear-gradient(0deg,rgba(58,20,112,.35) 0 2px,transparent 2px 16px),repeating-linear-gradient(90deg,rgba(58,20,112,.35) 0 2px,transparent 2px 16px);box-shadow:inset -22px -26px 40px rgba(30,10,60,.55),inset 18px 18px 30px rgba(255,255,255,.7),0 0 60px rgba(255,158,188,.55);animation:spin 9s linear infinite}

.fig{position:relative;width:48px;height:118px;flex:0 0 auto}
.fig .veil{position:absolute;left:0;top:2px;width:48px;height:92px;border-radius:24px 24px 8px 8px;background:rgba(255,255,255,.5)}
.fig .hairback{position:absolute;left:5px;top:4px;width:38px;height:50px;border-radius:19px 19px 10px 10px}
.fig .arm{position:absolute;top:40px;width:8px;height:34px;border-radius:4px;transform-origin:4px 4px}
.fig .arm.l{left:2px;rotate:12deg}.fig .arm.r{left:38px;rotate:-12deg}
.fig .leg{position:absolute;top:80px;width:9px;height:36px;border-radius:4px}
.fig .body{position:absolute;left:8px;top:36px;width:32px;height:46px;border-radius:12px 12px 6px 6px}
.fig .skirt{position:absolute;left:3px;top:62px;width:42px;height:28px;clip-path:polygon(16% 0,84% 0,100% 100%,0 100%)}
.fig .bowtie{position:absolute;left:18px;top:37px;width:12px;height:7px;background:#FFC857;clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,50% 50%,0 100%)}

.fig .head{position:absolute;left:9px;top:4px;width:30px;height:30px;border-radius:50%}
.fig .hairtop{position:absolute;left:8px;top:1px;width:32px;height:14px;border-radius:16px 16px 4px 4px}
.fig .tiara{position:absolute;left:16px;top:-6px;width:16px;height:8px;background:#FFC857;clip-path:polygon(0 100%,0 30%,25% 70%,50% 0,75% 70%,100% 30%,100% 100%)}
.mode-wave .arm.r{animation:waveR .7s ease-in-out infinite alternate}
@keyframes waveR{from{rotate:-160deg}to{rotate:-115deg}}
.mode-cheer .fig{animation:hop .6s ease-in-out infinite alternate}
.mode-cheer .arm.l{animation:cheerL .6s ease-in-out infinite alternate}.mode-cheer .arm.r{animation:cheerR .6s ease-in-out infinite alternate}
@keyframes hop{from{translate:0 0}to{translate:0 -7px}}
@keyframes cheerL{from{rotate:145deg}to{rotate:175deg}}@keyframes cheerR{from{rotate:-145deg}to{rotate:-175deg}}
.mode-clap .arm.l{animation:clapL .35s ease-in-out infinite alternate}.mode-clap .arm.r{animation:clapR .35s ease-in-out infinite alternate}
@keyframes clapL{from{rotate:20deg}to{rotate:-50deg}}@keyframes clapR{from{rotate:-20deg}to{rotate:50deg}}
.mode-dance .fig{animation:bounce .5s ease-in-out infinite}
.mode-dance .arm.l{animation:cheerL .5s ease-in-out infinite alternate}.mode-dance .arm.r{animation:clapR .5s ease-in-out infinite alternate}
@keyframes bounce{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -16px;rotate:4deg}}
.mode-sway .fig{transform-origin:50% 100%;animation:sway 1.6s ease-in-out infinite alternate}
.mode-sway .arm.l{rotate:50deg}.mode-sway .arm.r{rotate:-50deg}
@keyframes sway{from{rotate:-5deg}to{rotate:5deg}}
.crew .fig:nth-child(odd),.crew .fig:nth-child(odd) .arm{animation-delay:-.25s}
.crew .fig:nth-child(3n),.crew .fig:nth-child(3n) .arm{animation-delay:-.4s}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.fly{position:absolute;animation:fly 3.2s ease-in infinite}
@keyframes fly{from{left:-12%;top:78%;opacity:1}85%{opacity:1}to{left:104%;top:-14%;opacity:0}}
.beam{position:absolute;top:0;width:220px;height:330px;transform-origin:50% 0;opacity:.2;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:beam 2.4s ease-in-out infinite alternate}
@keyframes beam{from{rotate:-28deg}to{rotate:28deg}}
.tile{width:34px;height:14px;border-radius:3px;animation:flash 1s steps(2) infinite}
@keyframes flash{0%{opacity:.25}50%{opacity:1}}
.note{position:absolute;animation:floatup 2.6s ease-in infinite}

.board-wrap{height:2600px;position:relative}

.flip-scene{perspective:2400px}
.flipper{display:grid;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.25,.45,1)}
.flipper.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.flipper.flipped>.face:not(.back),.flipper:not(.flipped)>.face.back{pointer-events:none}

.stamp{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;font-family:'JetBrains Mono',monospace;font-weight:600;line-height:1.15;mix-blend-mode:multiply}
.vip{animation:vipspin 18s linear infinite}
@keyframes vipspin{from{rotate:-12deg}to{rotate:348deg}}

.crown-bob{animation:crown 2.2s ease-in-out infinite alternate}

.stage{position:relative;width:0;height:0}
.gift{position:absolute;left:-90px;top:-75px;width:180px;height:150px;animation:wobble .3s ease-in-out .2s 4}
@keyframes wobble{0%,100%{rotate:0deg}25%{rotate:-8deg}75%{rotate:8deg}}

.gift-lid::after{content:"";position:absolute;left:77px;top:0;width:26px;height:100%;background:#FFC857}

@keyframes ray{0%{scale:1 0;opacity:1}55%{opacity:1}100%{scale:1 1.15;opacity:0}}

.shot-r{position:absolute;left:0;top:0;width:0;height:0}
.shot-i{position:absolute;left:-5px;top:-9px;width:10px;height:18px;border-radius:3px;opacity:0}
.shot-i.round{width:12px;height:12px;border-radius:50%}
.shot-i.d1{animation:fly1 1.9s cubic-bezier(.1,.85,.3,1) 1.45s both}

.shot-i.d3{animation:fly3 1.9s cubic-bezier(.1,.85,.3,1) 1.45s both}
@keyframes fly1{0%{translate:0 0;rotate:0deg;opacity:1}80%{opacity:1}100%{translate:0 -460px;rotate:720deg;opacity:0}}
@keyframes fly2{0%{translate:0 0;rotate:0deg;opacity:1}80%{opacity:1}100%{translate:0 -340px;rotate:-540deg;opacity:0}}
@keyframes fly3{0%{translate:0 0;rotate:0deg;opacity:1}80%{opacity:1}100%{translate:0 -230px;rotate:400deg;opacity:0}}
.reveal-spark{position:absolute;opacity:0;animation:sparkpop .9s ease-out both}
@keyframes sparkpop{0%{opacity:0;scale:0}40%{opacity:1;scale:1.3}100%{opacity:0;scale:.6}}
.reveal-title{position:absolute;left:50%;top:calc(50% + 110px);translate:-50% 0;width:min(560px,90vw);text-align:center;opacity:0;animation:titlepop .6s cubic-bezier(.2,1.4,.4,1) 1.6s both}
@keyframes titlepop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
.intro{position:fixed;inset:0;z-index:80;background:#1E0A3C;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;animation:introOut .5s ease-in 4s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.intro-stage{position:relative;width:0;height:0;translate:0 -40px}
.bottle{position:absolute;left:-40px;top:-150px;width:80px;height:260px;transform-origin:50% 100%;rotate:-18deg;animation:bottleOut .5s ease-in 2s forwards}
@keyframes bottleOut{to{opacity:0;translate:-140px 40px}}
.bottle-shake{position:absolute;inset:0;animation:shake .12s linear .1s 8}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-4px 1px}75%{translate:4px -1px}}
.b-body{position:absolute;left:0;bottom:0;width:80px;height:160px;border-radius:30px 30px 14px 14px;background:#1F5A43;box-shadow:inset -12px 0 0 rgba(0,0,0,.25),inset 10px 0 0 rgba(255,255,255,.08)}
.b-neck{position:absolute;left:27px;top:46px;width:26px;height:80px;border-radius:8px 8px 0 0;background:#1F5A43}
.b-foil{position:absolute;left:25px;top:38px;width:30px;height:46px;border-radius:6px 6px 2px 2px;background:#FFC857}
.b-label{position:absolute;left:9px;bottom:42px;width:62px;height:58px;border-radius:6px;background:#FFF6D6;color:#1E0A3C;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;line-height:1.3}
.cork{position:absolute;left:28px;top:16px;width:24px;height:26px;border-radius:10px 10px 4px 4px;background:#D9B27C;animation:corkPop 1.4s cubic-bezier(.15,.8,.3,1) 1.15s forwards}
@keyframes corkPop{to{translate:180px -560px;rotate:620deg;opacity:0}}
.spray{position:absolute;left:40px;top:22px;width:0;height:0}
.pop-flash{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:#FFF6D6;box-shadow:0 0 40px 20px rgba(255,226,163,.8);opacity:0;animation:popflash .7s ease-out 1.15s both}
@keyframes popflash{0%{opacity:1;scale:.2}100%{opacity:0;scale:3.5}}
.foam-g{position:absolute;left:0;top:0;width:0;height:0;animation:grav2 1.4s cubic-bezier(.5,0,1,.5) 1.15s both}
@keyframes grav2{from{translate:0 0}to{translate:0 240px}}
.foam-r{position:absolute;left:0;top:0;width:0;height:0}
.foam-i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;opacity:0}
.foam-i.f1{animation:foam1 1.4s cubic-bezier(.1,.85,.3,1) 1.15s both}
.foam-i.f2{animation:foam2 1.4s cubic-bezier(.1,.85,.3,1) 1.15s both}
@keyframes foam1{0%{translate:0 0;opacity:0;scale:.5}6%{opacity:1}80%{opacity:1}100%{translate:0 -320px;opacity:0;scale:1.3}}
@keyframes foam2{0%{translate:0 0;opacity:0;scale:.5}6%{opacity:1}80%{opacity:1}100%{translate:0 -210px;opacity:0;scale:1}}
.pop-word{position:absolute;left:30px;top:-260px;font-family:'Caveat',cursive;font-weight:700;font-size:72px;color:#FFC857;opacity:0;rotate:-10deg;animation:popword 1s cubic-bezier(.2,1.4,.4,1) 1.2s both}
@keyframes popword{0%{opacity:0;scale:.3}30%{opacity:1;scale:1.1}75%{opacity:1;scale:1}100%{opacity:0;scale:1}}
.glass-wrap{position:absolute;left:-55px;top:-110px;width:110px;height:190px;opacity:0;animation:glassIn .5s ease-out 2.1s forwards}
@keyframes glassIn{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
.g-bowl{position:absolute;left:5px;top:0;width:100px;height:110px;border:3px solid rgba(255,255,255,.85);border-top:0;border-radius:0 0 50px 50px / 0 0 70px 70px;overflow:hidden;box-sizing:border-box}

.g-wine::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:#FFF6D6}
@keyframes fill{to{height:80%}}
.g-bub{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0;animation:rise 1.1s ease-in infinite}
@keyframes rise{0%{translate:0 0;opacity:0}20%{opacity:.9}100%{translate:0 -70px;opacity:0}}
.g-stem{position:absolute;left:52px;top:108px;width:6px;height:62px;background:rgba(255,255,255,.85)}
.g-base{position:absolute;left:25px;top:168px;width:60px;height:11px;border-radius:50%;background:rgba(255,255,255,.85)}
.pour{position:absolute;left:52px;top:-160px;width:6px;height:170px;border-radius:3px;background:#F2C94C;transform-origin:50% 0;scale:1 0;animation:pour 1.5s ease-in-out 2.3s both}

.intro-text{position:absolute;left:50%;top:calc(50% + 120px);translate:-50% 0;width:min(560px,90vw);text-align:center}
.intro-t1{animation:t1 2s ease-in-out both}
@keyframes t1{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
.intro-t2{position:absolute;left:0;right:0;top:0;opacity:0;animation:titlepop .6s cubic-bezier(.2,1.4,.4,1) 2.3s both}

.mini-glass{position:relative;display:inline-block;width:18px;height:26px;flex:0 0 auto}
.mini-glass .mg-bowl{position:absolute;left:0;top:0;width:18px;height:15px;border:2px solid currentColor;border-top:0;border-radius:0 0 9px 9px;overflow:hidden;box-sizing:border-box}
.mini-glass .mg-bowl b{position:absolute;left:0;right:0;bottom:0;height:0;background:currentColor;opacity:.75;animation:minifill 1.2s ease-in-out infinite}

.mini-glass .mg-stem{position:absolute;left:8px;top:15px;width:2px;height:8px;background:currentColor}
.mini-glass .mg-base{position:absolute;left:3px;top:23px;width:12px;height:2px;border-radius:1px;background:currentColor}
@keyframes bulb{from{opacity:1}to{opacity:.3}}
@keyframes crown{from{rotate:-8deg;translate:0 0}to{rotate:6deg;translate:0 -4px}}

</style>
</helmet>
<div style="min-height: 100vh; background: #3A1470; color: #FFFFFF; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding-bottom: 64px; position: relative; overflow-x: clip">

</div>

</div>
</div>
<div class="pop-word">POP!</div>

<span class="g-bub" style="left: 62px; animation-delay: 2.75s"></span>
<span class="g-bub" style="left: 32px; animation-delay: 3.1s"></span>
<span class="g-bub" style="left: 74px; animation-delay: 3.25s"></span>
</div></div>
<div class="g-stem"></div>
<div class="g-base"></div>
</div>
</div>
<div class="intro-text">
<div class="intro-t1">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.14em; font-weight: 600; color: #FFC857">LAST FLING AIRWAYS · FLIGHT LF-001</div>
<div style="font-size: clamp(26px, 4vw, 40px); font-weight: 800; line-height: 1.1; color: #FFFFFF; margin-top: 8px">{{brideName}}’s Last Fling is about to begin</div>

<button type="button" onClick="{{charSwitch}}" style="min-height: 52px; padding: 0 22px; border-radius: 999px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: inherit; font-weight: 600; font-size: 16px; cursor: pointer">Switch team</button>

<button type="button" onClick="{{dareGirls}}" style="min-height: 52px; padding: 0 22px; border-radius: 999px; border: 0; background: #FF9EBC; color: #1E0A3C; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer">Done — stamp for Girls</button>

</div>

<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D9CCF5">{{seatMapNote}}</div>

<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #4E5870; max-width: 640px">Point your phone camera at the QR code on a guest’s pass. It shows a pass code — type it here to confirm who they are.</p>
<form onSubmit="{{verify}}" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<label style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px; max-width: 420px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4E5870">PASS CODE</span>
<input type="text" value="{{gateInput}}" onChange="{{onGate}}" placeholder="LF001-00-XXXX" autocomplete="off" spellcheck="false" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 2px solid #14213D; font-family: 'JetBrains Mono', monospace; font-size: 18px; text-transform: uppercase; color: #14213D; background: #FFFFFF">
</label>
<button type="submit" style="min-height: 52px; padding: 0 28px; border-radius: 12px; border: 0; background: #1E0A3C; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 17px; cursor: pointer">Verify</button>
</form>
<sc-if value="{{gateOk}}" hint-placeholder-val="{{false}}">
<div class="pop" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; background: #E3F6EF; border: 2px solid #00695C; border-radius: 18px; padding: 20px 24px">
<div style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 18px; color: #00695C; border: 3px solid #00695C; border-radius: 10px; padding: 8px 14px; rotate: -4deg">CLEARED ✓</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 220px; min-width: 0">
<div style="font-size: 26px; font-weight: 800">{{gateMatch.name}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #33475B">PASS {{gateMatch.passNo}} · SEAT {{gateMatch.seat}}</div>
</div>
<sc-if value="{{gateNotBoarded}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{markBoarded}}" style="min-height: 48px; padding: 0 20px; border-radius: 999px; border: 0; background: #00695C; color: #FFFFFF; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Mark as boarded</button>
</sc-if>
<sc-if value="{{gateBoarded}}" hint-placeholder-val="{{false}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: #00695C">ON BOARD</span>
</sc-if>
</div>
</sc-if>
<sc-if value="{{gateBad}}" hint-placeholder-val="{{false}}">
<div class="pop" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: #FDECF2; border: 2px solid #C2185B; border-radius: 18px; padding: 20px 24px">
<div style="font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 18px; color: #C2185B; border: 3px solid #C2185B; border-radius: 10px; padding: 8px 14px; rotate: -4deg">NOT ON THE MANIFEST</div>
<div style="font-size: 16px; color: #4E5870">Check the code again — every pass starts with LF001.</div>
</div>
</sc-if>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #4E5870">{{boardedCount}} OF {{passengerCount}} PASSENGERS BOARDED</div>
</div>
</section>

<footer style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #D9CCF5">
